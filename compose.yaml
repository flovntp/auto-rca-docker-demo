services:
  # The app: a 500 is queued for triage, once per distinct bug. It holds no
  # API key nor GitHub token.
  app:
    image: auto-rca-app
    build:
      context: ./app
      args:
        APP_REVISION: ${APP_REVISION:-}
    container_name: rca-demo-app
    environment:
      APP_SECRET: ${APP_SECRET}
      RCA_ENABLED: ${RCA_ENABLED:-1}
    ports:
      - "8090:80"
    volumes:
      # The incidents already handed to an agent, kept across restarts.
      - rca-share:/app/var/share
      # The payments' SQLite database.
      - app-data:/app/var/data
    restart: unless-stopped

  # The worker: same image, consumes the queue. A small model triages each
  # incident (Symfony AI), opens the issue, and asks the runner for a coding
  # agent only for a bug the code can fix. A message it gives up on, after its
  # retries, is an incident too.
  worker:
    image: auto-rca-app
    container_name: rca-demo-worker
    command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600", "--memory-limit=256M"]
    depends_on: [app]
    environment:
      APP_SECRET: ${APP_SECRET}
      RCA_ENABLED: ${RCA_ENABLED:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-claude-haiku-5-5}
      GITHUB_ISSUES_TOKEN: ${GITHUB_ISSUES_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      RCA_RUNNER_URL: http://runner:8080
      RCA_RUNNER_SECRET: ${RCA_RUNNER_SECRET}
    volumes:
      # The same claims as the app's: one triage per bug, wherever it fails.
      - rca-share:/app/var/share
      - app-data:/app/var/data
    restart: unless-stopped

  # The only service with the Docker socket. No published port: only the worker,
  # on the project's network, can reach it.
  runner:
    build: ./runner
    environment:
      RCA_RUNNER_SECRET: ${RCA_RUNNER_SECRET}
      APP_CONTAINER: rca-demo-app
      WORKER_CONTAINER: rca-demo-worker
      AGENT_IMAGE: rca-agent:latest
      MAX_PARALLEL: "2"
      # On a Synology NAS, set AGENT_CPU_SHARES=512 in .env: --cpus isn't supported there.
      AGENT_CPU_SHARES: ${AGENT_CPU_SHARES:-}
      # On a kernel older than 3.17 (Synology): AGENT_PRELOAD=/usr/local/lib/libgetrandom-shim.so
      AGENT_PRELOAD: ${AGENT_PRELOAD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Not a service: declared so that `docker compose build` builds the image
  # the runner starts, one container per incident.
  agent:
    build: ./agent
    image: rca-agent:latest
    profiles: [build-only]

  # A ramp-up on the app: docker compose --profile load run --rm load
  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: run --quiet /scripts/payments.js
    volumes:
      - ./load:/scripts:ro

volumes:
  rca-share:
  app-data:
