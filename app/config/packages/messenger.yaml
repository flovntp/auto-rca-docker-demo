framework:
    messenger:
        failure_transport: failed

        transports:
            # A queue in SQLite, on the volume shared by the app and the worker.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 10000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Triage\TriageIncident: async
            App\Invoice\SendPaymentReminder: async
